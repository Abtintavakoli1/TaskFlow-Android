name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "EXIT:$?"
          echo "=== FIND APK ==="
          find . -name "*.apk" 2>/dev/null | head -20; echo "---"
          ls -R app/build/outputs/ 2>/dev/null | head -40; echo "---"
          cat /tmp/gradle.log | tail -n 80
      - name: Upload log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
