name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          echo "=== Cap sync ==="
          npx cap sync android 2>&1
          echo "=== Gradle ==="
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -n 300 | head -n 200
          echo "=== After build ==="
          echo "Finding APKs..."
          find . -name "*.apk" -type f 2>/dev/null
          find . -path "*/build/outputs/*" -type f 2>/dev/null | head -20
          ls -R app/build/outputs/ 2>/dev/null | head -50
          ls -la app/build/ 2>/dev/null | head -20
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
