name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "EXIT:$?"
          find . -name "*.apk" 2>/dev/null | head -20
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug"
          ls -lh app/build/outputs/ 2>/dev/null | head -20
      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            /tmp/gradle.log
          if-no-files-found: warn
