name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          echo "EXIT:$?" | tee -a /tmp/build.log
      - name: Upload logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build.log
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
