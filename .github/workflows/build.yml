name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          echo "=== Gradle version ===" && ./gradlew --version
          echo "=== Build ===" && ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "=== EXIT:$? ===" 
          find . -name "*.apk" -type f 2>/dev/null
          ls -R app/build 2>/dev/null | head -100
      - name: Upload all outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            /tmp/gradle.log
            android/app/build/outputs/
            android/build/
          if-no-files-found: warn
