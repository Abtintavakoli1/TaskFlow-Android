name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Show failure logs
        if: failure()
        run: |
          echo "=== Gradle logs ==="
          find android -name "*.log" -exec cat {} \; 2>/dev/null | tail -n 200
          echo "=== Build outputs ==="
          ls -la android/app/build/ 2>/dev/null || echo "No build dir"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
