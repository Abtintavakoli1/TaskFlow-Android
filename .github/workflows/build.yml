name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace | tee /tmp/build.log
          echo "=== Outputs ===" && find android -name "*.apk" -type f 2>/dev/null | head -20
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug dir"
          ls -lh android/app/build/outputs/ 2>/dev/null | head -20
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn
