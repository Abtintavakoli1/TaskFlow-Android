name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace 2>&1 | tail -n 100
          echo "=== FIND APK ==="
          find android -name "*.apk" -type f 2>/dev/null | head -20
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "no debug dir"
          ls -la android/app/build/outputs/ 2>/dev/null || echo "no outputs"
          echo "=== UPLOAD ANY APK ==="
          mkdir -p /tmp/apk && find android -name "*.apk" -exec cp {} /tmp/apk/ \; 2>/dev/null; ls -lh /tmp/apk/ 2>/dev/null || echo "no apk found"
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: /tmp/apk/*.apk
          if-no-files-found: error
